<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文字数カウンター</title>
<style>
  :root { --bg:#f6f3ee; --card:#fff; --text:#222; --muted:#777; --accent:#8a5a2b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 1.4rem; font-weight: 600; letter-spacing: .05em; }
  textarea { width:100%; height: 240px; padding:12px; font-size:1rem; line-height:1.7;
             border:1px solid #ddd; border-radius:8px; resize:vertical; }
  .stats { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; margin-top:16px; }
  .stat { background:var(--card); border-radius:8px; padding:12px; text-align:center; }
  .stat b { display:block; font-size:1.6rem; color:var(--accent); }
  .stat span { font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>文字数カウンター</h1>
  <textarea id="input" placeholder="ここに文章を貼り付けてください"></textarea>
  <div class="stats">
    <div class="stat"><b id="chars">0</b><span>文字数（空白含む）</span></div>
    <div class="stat"><b id="charsNoSpace">0</b><span>文字数（空白除く）</span></div>
    <div class="stat"><b id="lines">0</b><span>行数</span></div>
  </div>
</main>
<script>
  const input = document.getElementById('input');
  function count() {
    const text = input.value;
    const chars = [...text.replace(/\n/g, '')].length;
    const charsNoSpace = [...text.replace(/\s/g, '')].length;
    const lines = text === '' ? 0 : text.split('\n').length;
    document.getElementById('chars').textContent = chars;
    document.getElementById('charsNoSpace').textContent = charsNoSpace;
    document.getElementById('lines').textContent = lines;
  }
  input.addEventListener('input', count);
</script>
</body>
</html>
